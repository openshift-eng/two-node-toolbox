- hosts: metal_machine
  gather_facts: no
  force_handlers: yes

  pre_tasks:
    - name: Confirm infrastructure topology transition
      ansible.builtin.pause:
        prompt: >-
          This will transition the cluster infrastructureTopology from SingleReplica
          to HighlyAvailable (control plane topology is unchanged).
          By default the SR state is first simulated via an unsupported
          Infrastructure.status patch, and the MutableTopology FeatureGate is
          enabled by switching the cluster to featureSet CustomNoUpgrade -
          that switch is irreversible and blocks cluster upgrades.
          Press Enter to proceed or Ctrl+C to abort.
      delegate_to: localhost
      run_once: true
      when: interactive_mode | default(true) | bool

  roles:
    - mutable-topology/infra-to-ha

  tasks:
    - name: Transition complete
      ansible.builtin.debug:
        msg: "Infrastructure topology transition to HighlyAvailable completed successfully."
