# Deploy a TNF fencing cluster on adopted baremetal nodes via dev-scripts ABI.
#
# Targets the [provisioning_host] group from inventory_baremetal.ini.
# Expects adoption artifacts from 'make baremetal-adopt' in
# roles/dev-scripts/install-dev/files/.
#
# Usage:
#   ansible-playbook deploy-baremetal.yml -i inventory_baremetal.ini
#   ansible-playbook deploy-baremetal.yml -i inventory_baremetal.ini -e dev_scripts_branch=my-branch
#
- hosts: provisioning_host
  gather_facts: no
  force_handlers: yes

  vars:
    method: agent
    topology: fencing
    test_cluster_name: ostest

  pre_tasks:
    - name: Check adoption artifacts exist on controller
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/roles/dev-scripts/install-dev/files/{{ item }}"
      delegate_to: localhost
      become: false
      register: artifact_check
      loop:
        - config_baremetal_fencing.sh
        - ironic_nodes.json

    - name: Fail if adoption artifacts are missing
      ansible.builtin.fail:
        msg: >-
          Adoption artifact not found: {{ item.item }}.
          Run 'make baremetal-adopt' first.
      when: not item.stat.exists
      loop: "{{ artifact_check.results }}"
      loop_control:
        label: "{{ item.item }}"

  tasks:
    - name: Resolve dev-scripts defaults
      ansible.builtin.set_fact:
        dev_scripts_path: "{{ dev_scripts_path | default('openshift-metal3/dev-scripts') }}"
        dev_scripts_src_repo: "{{ dev_scripts_src_repo | default('https://github.com/openshift-metal3/dev-scripts') }}"
        dev_scripts_branch: "{{ dev_scripts_branch | default('master') }}"

    - name: Setup git identity on provisioning host
      ansible.builtin.include_role:
        name: git-user

    # --- Git checkout (must precede config role — creates dev_scripts_path) ---
    - name: Checkout dev-scripts
      ansible.builtin.git:
        dest: "{{ dev_scripts_path }}"
        repo: "{{ dev_scripts_src_repo }}"
        version: "{{ dev_scripts_branch }}"

    # --- Validation, config deploy, pull-secret (reused from install-dev role) ---
    - name: Validate and deploy config + pull-secret
      ansible.builtin.include_role:
        name: dev-scripts/install-dev
        tasks_from: config
      vars:
        method: agent
        config_file:
          agent: config_baremetal_fencing.sh
        install_host_deps: false

    # --- Baremetal-specific setup ---
    - name: Copy ironic_nodes.json to dev-scripts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/roles/dev-scripts/install-dev/files/ironic_nodes.json"
        dest: "{{ dev_scripts_path }}/ironic_nodes.json"
        mode: "0600"

    - name: Create working directory
      ansible.builtin.shell: mkdir -p "${HOME}/dev-scripts-workdir"
      changed_when: false

    - name: Append WORKING_DIR to deployed config
      ansible.builtin.lineinfile:
        path: "{{ dev_scripts_path }}/config_{{ whoami.stdout }}.sh"
        regexp: '^export WORKING_DIR='
        line: 'export WORKING_DIR="${HOME}/dev-scripts-workdir"'

    # --- Ensure SSH key exists for node access ---
    - name: Check for existing SSH keypair
      ansible.builtin.stat:
        path: ~/.ssh/id_ed25519
      register: ssh_key_check

    - name: Generate SSH keypair if missing
      ansible.builtin.command:
        cmd: ssh-keygen -t ed25519 -f ~/.ssh/id_ed25519 -N ''
      when: not ssh_key_check.stat.exists

    - name: Read SSH public key
      ansible.builtin.slurp:
        src: ~/.ssh/id_ed25519.pub
      register: ssh_pub_key

    - name: Append SSH_PUB_KEY to deployed config
      ansible.builtin.lineinfile:
        path: "{{ dev_scripts_path }}/config_{{ whoami.stdout }}.sh"
        regexp: '^export SSH_PUB_KEY='
        line: 'export SSH_PUB_KEY="{{ ssh_pub_key.content | b64decode | trim }}"'

    - name: Create empty mirror registry credentials
      ansible.builtin.shell: |
        f="${HOME}/private-mirror-{{ test_cluster_name }}.json"
        [ -f "$f" ] || echo '{"auths":{}}' > "$f"
      changed_when: false

    # --- Clean prior deployment state ---
    - name: Remove prior cluster state (required by dev-scripts verifyClean)
      ansible.builtin.file:
        path: "{{ dev_scripts_path }}/ocp/{{ test_cluster_name }}"
        state: absent

    # --- Cluster state: deploying ---
    - name: Set cluster state to deploying
      ansible.builtin.include_role:
        name: common
        tasks_from: cluster-state
      vars:
        cluster_state_dir: "{{ playbook_dir }}/clusters/{{ test_cluster_name }}"
        cluster_state_filename: cluster-state.json
        cluster_state_phase: deploying
        default_playbook_name: deploy-baremetal.yml

    # --- Deploy ---
    - name: Run dev-scripts ABI pipeline
      block:
        - name: Run dev-scripts make target
          make:
            chdir: "{{ dev_scripts_path }}"
            target: "{{ item }}"
          loop:
            - requirements
            - agent_requirements
            - agent_build_installer
            - agent_prepare_release
            - agent_configure
            - agent_create_cluster
          loop_control:
            label: "{{ item }}"
      rescue:
        - name: Display recovery instructions
          ansible.builtin.debug:
            msg: |
              DEPLOYMENT FAILED. To recover:
                1. Power off baremetal nodes via BMC
                2. Clean dev-scripts state:
                   make -C {{ dev_scripts_path }} clean
                3. Fix the issue and re-run:
                   make baremetal-fencing-agent
        - name: Fail after displaying recovery steps
          ansible.builtin.fail:
            msg: "dev-scripts ABI pipeline failed"

    # --- Cluster state: deployed ---
    - name: Set cluster state to deployed
      ansible.builtin.include_role:
        name: common
        tasks_from: cluster-state
      vars:
        cluster_state_dir: "{{ playbook_dir }}/clusters/{{ test_cluster_name }}"
        cluster_state_filename: cluster-state.json
        cluster_state_phase: deployed
        default_playbook_name: deploy-baremetal.yml

    # --- Post-deploy: proxy + credentials ---
    - name: Setup proxy and fetch credentials
      ansible.builtin.include_role:
        name: proxy-setup
      vars:
        kubeconfig_path: "{{ dev_scripts_path }}/ocp/{{ test_cluster_name }}/auth/kubeconfig"
        kubeadmin_password_path: "{{ dev_scripts_path }}/ocp/{{ test_cluster_name }}/auth/kubeadmin-password"

    - name: Update inventory with cluster nodes
      ansible.builtin.include_tasks:
        file: roles/common/tasks/update-baremetal-inventory.yml

    - name: Fetch SSH private key to controller
      ansible.builtin.fetch:
        src: ~/.ssh/id_ed25519
        dest: "clusters/{{ test_cluster_name }}/auth/id_ed25519"
        flat: true
        mode: "0600"

    - name: Display access information
      ansible.builtin.debug:
        msg: |-
          Baremetal TNF cluster deployed successfully!

          Next steps:
          1. Source the proxy environment from anywhere:
             source {{ playbook_dir }}/proxy.env
             (or from openshift-clusters directory: source proxy.env)
          2. Verify cluster access: oc get nodes
          3. SSH to nodes:
             ssh -i clusters/{{ test_cluster_name }}/auth/id_ed25519 core@<node-ip>
