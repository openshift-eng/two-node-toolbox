# Test-scenario setup: simulate a SingleReplica-infrastructure cluster by
# patching Infrastructure.status.infrastructureTopology to SingleReplica on an
# already-HA cluster. Only intended for testing the SR -> HA transition.

- name: "[setup] Read current Infrastructure status topologies"
  ansible.builtin.shell:
    cmd: oc get infrastructure cluster -o jsonpath='{.status.controlPlaneTopology},{.status.infrastructureTopology}'
  environment: "{{ infra_to_ha_oc_env }}"
  register: setup_current_topo
  changed_when: false

- name: "[setup] Display current topologies"
  ansible.builtin.debug:
    msg: "Current topologies: {{ setup_current_topo.stdout }}"

- name: "[setup] Fail if control plane is not HighlyAvailable"
  ansible.builtin.fail:
    msg: >-
      Scenario setup expects controlPlaneTopology=HighlyAvailable,
      got '{{ setup_current_topo.stdout.split(",")[0] }}'.
  when: setup_current_topo.stdout.split(",")[0] != "HighlyAvailable"

- name: "[setup] Skip scenario setup - infrastructureTopology already SingleReplica"
  ansible.builtin.debug:
    msg: "infrastructureTopology is already SingleReplica - no status patch needed."
  when: setup_current_topo.stdout.split(",")[1] | default('') == "SingleReplica"

- name: "[setup] Patch Infrastructure.status.infrastructureTopology to SingleReplica"
  ansible.builtin.shell:
    cmd: >
      oc patch infrastructure cluster --type merge --subresource status
      -p '{"status":{"infrastructureTopology":"SingleReplica"}}'
  environment: "{{ infra_to_ha_oc_env }}"
  when: setup_current_topo.stdout.split(",")[1] | default('') != "SingleReplica"

- name: "[setup] Verify status patch applied"
  ansible.builtin.shell:
    cmd: oc get infrastructure cluster -o jsonpath='{.status.infrastructureTopology}'
  environment: "{{ infra_to_ha_oc_env }}"
  register: setup_verify
  changed_when: false
  retries: 5
  delay: 2
  until: setup_verify.stdout == "SingleReplica"
  when: setup_current_topo.stdout.split(",")[1] | default('') != "SingleReplica"

- name: "[setup] Scenario ready"
  ansible.builtin.debug:
    msg: >-
      Scenario staged: controlPlaneTopology=HighlyAvailable,
      infrastructureTopology=SingleReplica (simulated via status patch).
      Pending monitoring pods will be cleaned up in a later phase.
