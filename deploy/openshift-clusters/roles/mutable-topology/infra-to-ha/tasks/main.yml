- name: "Phase 0: Read-only pre-checks (oc capability, nodes, cluster operators)"
  import_tasks: precheck.yml

- name: "Phase 1: Optional test-scenario setup (simulate SingleReplica infra)"
  import_tasks: setup-scenario.yml
  when: infra_to_ha_simulate_single_replica | default(true) | bool

- name: "Phase 2: Preflight checks"
  import_tasks: preflight.yml

- name: "Phase 3: Enable MutableTopology FeatureGate"
  import_tasks: featuregate.yml
  when:
    - infra_to_ha_enable_featuregate | default(true) | bool
    - infra_to_ha_needs_transition | default(false)

- name: "Phase 4: Clean up Pending monitoring pods"
  import_tasks: cleanup-pending-pods.yml
  when:
    - infra_to_ha_cleanup_pending_monitoring_pods | default(true) | bool
    - infra_to_ha_needs_transition | default(false)

- name: "Phase 5: Infrastructure topology transition"
  import_tasks: topology.yml

- name: "Phase 6: IngressController reconfiguration for HA"
  # Always runs: verifies the IngressController config on the verify-only path
  # (already HA); destructive tasks inside are guarded by
  # infra_to_ha_needs_transition.
  import_tasks: ingress-reconfigure.yml

- name: "Phase 7: Clean up Pending pods after transition"
  import_tasks: cleanup-pending-pods.yml
  when:
    - infra_to_ha_cleanup_pending_monitoring_pods | default(true) | bool
    - infra_to_ha_needs_transition | default(false)

- name: "Phase 8: Final verification"
  import_tasks: verify.yml
