- name: Copy pull secrets
  copy:
    dest: "{{dev_scripts_path}}/pull_secret.json"
    src: pull-secret.json

- name: Get username
  command: whoami
  changed_when: false
  become: false
  register: whoami

- name: Configure dev-scripts
  copy:
    dest: "{{dev_scripts_path}}/config_{{whoami.stdout}}.sh"
    src: "{{config_file[method]}}"
  register: dev_scripts_config

- name: Configure SSH_PUB_KEY for hypervisor-to-VM access
  lineinfile:
    path: "{{dev_scripts_path}}/config_{{whoami.stdout}}.sh"
    regexp: '^export SSH_PUB_KEY='
    line: 'export SSH_PUB_KEY="$(cat ~/.ssh/id_rsa.pub)"'
    insertafter: EOF

- name: Install dependencies
  ansible.builtin.dnf:
    name: 
    - podman
    - runc
    - containernetworking-plugins
    state: present
  become: true